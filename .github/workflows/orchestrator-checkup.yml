name: AffiliateOS orchestrator checkup
on:
  push:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-checkup.yml'
      - 'articles/**'
      - 'index.html'
      - 'about.html'
  schedule:
    - cron: '17 7,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: affiliate-orchestrator-readonly
  cancel-in-progress: false
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout owner repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # observed GitHub-resolved checkout v4 commit
        with:
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Validate versioned employee skill packs
        run: python3 orchestrator/skills/skill_audit.py
      - name: Test task coordination and QA safety
        run: python3 -m unittest discover -s orchestrator/tests -p 'test_*.py' -v
      - name: Check claim-to-source editorial safeguards
        run: python3 scripts/check_editorial_evidence.py
      - name: Generate role performance diagnostics (read-only, no grade fabrication)
        run: |
          python3 orchestrator/performance/agent_scorecard.py --out agent-scorecard.md --json agent-scorecard.json
      - name: Generate verified task checkup
        if: always()
        run: python3 orchestrator/orchestrate.py checkup --out orchestrator-checkup.json
      - name: Preserve audit report as Actions artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed GitHub-resolved upload-artifact v4 commit
        with:
          name: affiliate-orchestrator-checkup
          path: |
            orchestrator-checkup.json
            agent-scorecard.md
            agent-scorecard.json
          if-no-files-found: warn
          retention-days: 7