name: Site quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate HTML and local assets
        run: python3 scripts/check_site.py
      - name: Validate indexable-only sitemap
        run: python3 scripts/build_sitemap.py --check
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test-only open-source Chromium browser QA tools
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install chromium
      - name: Browser QA of mobile/desktop layout and interactive utilities
        run: python3 scripts/browser_smoke.py
      - name: Save screenshots for separate visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicestack-responsive-qa
          path: qa_screenshots/
          if-no-files-found: ignore
