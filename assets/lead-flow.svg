<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="ttl desc"><title id="ttl">Example lead funnel for a service website</title><desc id="desc">A three-step illustration from local search visitor to quote form to answered request and scheduled appointment, with one conversion measurement at each step.</desc><rect width="1000" height="290" rx="28" fill="#eaf1ee"/><g font-family="Arial,sans-serif" fill="#152c26"><g><rect x="38" y="48" width="268" height="190" rx="22" fill="#fff"/><circle cx="170" cy="92" r="25" fill="#c9e8d3"/><path d="M170 80a13 13 0 1 0 0 26a13 13 0 1 0 0-26m9 22l12 12" fill="none" stroke="#21674a" stroke-width="5" stroke-linecap="round"/><text x="172" y="146" text-anchor="middle" font-weight="700" font-size="24">Search visitor</text><text x="172" y="177" text-anchor="middle" font-size="17" fill="#45635b">View the right service</text><text x="172" y="204" text-anchor="middle" font-size="17" fill="#45635b">and service area</text></g><path d="M326 143h50m-10-9 13 9-13 9" fill="none" stroke="#28785a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="386" y="48" width="245" height="190" rx="22" fill="#fff"/><rect x="484" y="74" width="50" height="35" rx="8" fill="#c9e8d3" stroke="#21674a" stroke-width="3"/><path d="M492 84h34m-34 10h23" stroke="#21674a" stroke-width="3"/><text x="508" y="146" text-anchor="middle" font-weight="700" font-size="24">Quote request</text><text x="508" y="177" text-anchor="middle" font-size="17" fill="#45635b">Only essential fields</text><text x="508" y="204" text-anchor="middle" font-size="17" fill="#45635b">and a clear next step</text></g><path d="M652 143h46m-11-9 13 9-13 9" fill="none" stroke="#28785a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="709" y="48" width="253" height="190" rx="22" fill="#fff"/><circle cx="833" cy="91" r="23" fill="#c9e8d3"/><path d="M820 92l9 8 18-19" fill="none" stroke="#21674a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="833" y="146" text-anchor="middle" font-weight="700" font-size="24">Follow-up</text><text x="833" y="177" text-anchor="middle" font-size="17" fill="#45635b">Reply, track outcome</text><text x="833" y="204" text-anchor="middle" font-size="17" fill="#45635b">and improve the funnel</text></g></g></svg>